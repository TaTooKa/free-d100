<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Free d100</title>

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />

  <link id="theme-vue" rel="stylesheet"
    href="//cdn.jsdelivr.net/gh/pikapikapikaori/docsify-simple-dark-mode@latest/dist/css/theme/vue.min.css" />
  <link id="theme-dark" rel="stylesheet"
    href="//cdn.jsdelivr.net/gh/pikapikapikaori/docsify-simple-dark-mode@latest/dist/css/theme/dark.min.css" disabled />
  <link id="theme-color" rel="stylesheet" href="" disabled />

  <style>
    /* --- theme: strip everything except the dark-mode toggle --- */
    #switchThemeSpan,
    #colorPickerSpan,
    #showWidgetsSpan,
    #progressSpan,
    #scrollToTopSpan,
    #themePickerPopupSpan,
    #colorPickerPopupSpan {
      display: none !important;
    }

    /* Dark mode only: #theme-dark has no `disabled` attribute when dark is active */
    :root:has(#theme-dark:not([disabled])) {
      --color-bg: #18181a;
      /* page + content */
      --sidebar-bg: #18181a;
      /* sidebar panel */
      --code-bg: #060d2b;
      /* inline code */
      --codeblock-bg: #060d2b;
      /* fenced blocks */
      --table-row-alt-bg: #0a1330;
      /* zebra rows */
      --sidebar-toggle-bg: rgba(1, 5, 25, .8);
      --border-color: rgba(255, 255, 255, .12);
      --sidebar-border-color: rgba(255, 255, 255, .12);
    }
  </style>

</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Free d100',
      loadSidebar: true,
      subMaxLevel: 2,
      homepage: 'index.md',
      addWidgets: {
        useSwitchMode: true,
        themes: [
          {
            name: 'default',
            light: null,          // null => toggle the #theme-vue / #theme-dark <link>s
            dark: null,
            lightColor: '#ffffff',   // only used by the (hidden) theme-picker swatch
            darkColor: '#18181a',
            lightThemeColor: '#0284c7',
            darkThemeColor: '#7dd3fc'
          }
        ]
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>

  <link rel="stylesheet"
    href="//cdn.jsdelivr.net/gh/pikapikapikaori/docsify-simple-dark-mode@latest/dist/css/addWidgets.min.css" />
  <script
    src="//cdn.jsdelivr.net/gh/pikapikapikaori/docsify-simple-dark-mode@latest/dist/js/addWidgets.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>

</body>

</html>
